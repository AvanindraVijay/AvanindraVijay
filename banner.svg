<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color"
          values="#0d1117;#12233b;#0d1117"
          dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1a2b4c">
        <animate attributeName="stop-color"
          values="#1a2b4c;#2d1b4e;#1a2b4c"
          dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0d1117">
        <animate attributeName="stop-color"
          values="#0d1117;#12233b;#0d1117"
          dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)" rx="12" />

  <text x="600" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff"
        text-anchor="middle">
    Avanindra Vijay
  </text>

  <text x="600" y="175" font-family="JetBrains Mono, Consolas, monospace"
        font-size="20" fill="#58a6ff" text-anchor="middle">
    <tspan>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0s" repeatCount="indefinite" />
      Building Practical AI Systems
    </tspan>
  </text>
  <text x="600" y="175" font-family="JetBrains Mono, Consolas, monospace"
        font-size="20" fill="#58a6ff" text-anchor="middle">
    <tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" dur="4s" begin="4s" repeatCount="indefinite" />
      LLMs | RAG | Agentic AI | Computer Vision
    </tspan>
  </text>

  <text x="600" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" fill="#8b949e" text-anchor="middle">
    AI Engineer · GenAI Developer · Data Scientist
  </text>

  <path d="M0,260 Q300,230 600,260 T1200,260 V280 H0 Z" fill="#161b22" opacity="0.6">
    <animate attributeName="d"
      values="M0,260 Q300,230 600,260 T1200,260 V280 H0 Z;
              M0,260 Q300,270 600,250 T1200,260 V280 H0 Z;
              M0,260 Q300,230 600,260 T1200,260 V280 H0 Z"
      dur="5s" repeatCount="indefinite" />
  </path>
</svg>
