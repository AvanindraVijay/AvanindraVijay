<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="botBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#2f6fbd"/>
    </linearGradient>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-8; 0,0" dur="3s" repeatCount="indefinite" />

    <!-- antenna -->
    <line x1="110" y1="35" x2="110" y2="15" stroke="#8b949e" stroke-width="3"/>
    <circle cx="110" cy="12" r="6" fill="#58a6ff">
      <animate attributeName="fill" values="#58a6ff;#ffd166;#58a6ff" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- head -->
    <rect x="60" y="35" width="100" height="80" rx="18" fill="url(#botBody)" stroke="#161b22" stroke-width="3"/>

    <!-- eyes -->
    <g>
      <circle cx="88" cy="75" r="9" fill="#0d1117"/>
      <circle cx="132" cy="75" r="9" fill="#0d1117"/>
      <rect x="78" y="70" width="20" height="10" fill="url(#botBody)">
        <animate attributeName="height" values="0;10;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="75;70;75" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="122" y="70" width="20" height="10" fill="url(#botBody)">
        <animate attributeName="height" values="0;10;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="75;70;75" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- smile -->
    <path d="M85,95 Q110,110 135,95" stroke="#0d1117" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- body -->
    <rect x="75" y="120" width="70" height="55" rx="14" fill="#21262d" stroke="#161b22" stroke-width="3"/>
    <circle cx="110" cy="147" r="12" fill="#58a6ff" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- arms -->
    <line x1="75" y1="135" x2="50" y2="150" stroke="#8b949e" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        values="0 75 135; -15 75 135; 0 75 135" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="145" y1="135" x2="170" y2="150" stroke="#8b949e" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
